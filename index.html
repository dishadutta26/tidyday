<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tidy Day</title>
<meta name="description" content="A calm daily planner: one timeline for tasks, habits and appointments, with reminders, focus timer and daily review. Your data stays on your phone.">
<meta name="theme-color" content="#f5f7fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121418" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tidy Day">
<style>
/* Readability-first palette (all text passes WCAG AA; body text ~14:1).
   Light: soft grey page, white cards, near-black text. Dark: dark grey (not pure black), off-white text. */
:root{
  --bg:#f5f7fa;--card:#ffffff;--ink:#1c2430;--mute:#566170;--line:#e3e7ed;
  --accent:#2a62c9;--accent-ink:#ffffff;--warn:#b4540f;--done:#8a94a1;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.05);color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#121418;--card:#1b1f25;--ink:#e4e7eb;--mute:#9ba3ae;--line:#2b313a;
    --accent:#7aaefc;--accent-ink:#0d1726;--warn:#f2a466;--done:#6b7480;--shadow:none;color-scheme:dark;
  }
}
:root[data-theme=dark]{
  --bg:#121418;--card:#1b1f25;--ink:#e4e7eb;--mute:#9ba3ae;--line:#2b313a;
  --accent:#7aaefc;--accent-ink:#0d1726;--warn:#f2a466;--done:#6b7480;--shadow:none;color-scheme:dark;
}
:root{--soft:color-mix(in srgb,var(--accent) 12%,var(--card));--warn-soft:color-mix(in srgb,var(--warn) 12%,var(--card))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 24px}

/* header */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 4px}
.hdr .date{font-size:13px;color:var(--mute);font-weight:500}
.hdr h1,.ttl{font-size:26px;line-height:1.2;margin:2px 0 0;letter-spacing:-.01em;font-weight:700}
.streak{font-size:13px;color:var(--warn);font-weight:600;margin-top:4px}
.ring{position:relative;width:62px;height:62px;flex:none}
.ring svg{display:block}
.ring .trk{fill:none;stroke:var(--line);stroke-width:6}
.ring .bar{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:700}
.lead{color:var(--mute);margin:6px 0 12px}

/* cards & rows */
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);margin:14px 0;overflow:hidden}
.card h2,.sect{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0;padding:14px 16px 8px;
  font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.sect{padding:18px 2px 2px}
.count{font-variant-numeric:tabular-nums}
.pad{padding:12px 16px}
.note{font-size:13px;color:var(--mute)}
.empty{padding:4px 16px 14px;font-size:14px;color:var(--mute)}
.row{display:flex;align-items:center;gap:12px;padding:10px 8px 10px 14px;border-top:1px solid var(--line)}
.card h2 + .row,.card h2 + .note + .row{border-top:0}
.body{flex:1;min-width:0}
.title{font-weight:600;overflow-wrap:anywhere}
.sub{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:2px;font-size:13px;color:var(--mute)}
.row.done .title,.blk.done .title{text-decoration:line-through;color:var(--done)}
.check{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid color-mix(in srgb,var(--ink) 22%,transparent);background:var(--card);
  display:grid;place-items:center;color:transparent;padding:0;font-size:12px;font-weight:700;transition:.15s}
.check:active{transform:scale(.88)}
.check.water{color:var(--accent);border-color:var(--soft);background:var(--soft)}
.done > .check,.done .bc .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.icon-btn{flex:none;width:36px;height:36px;border:0;border-radius:12px;background:none;color:var(--mute);display:grid;place-items:center;padding:0}
.icon-btn:active{background:var(--line)}
.bell.on{color:var(--accent);background:var(--soft)}
.badge{font-size:11px;font-weight:700;background:var(--warn-soft);color:var(--warn);padding:1px 8px;border-radius:99px}
.tag{font-size:11px;font-weight:600;background:var(--bg);border:1px solid var(--line);padding:0 8px;border-radius:99px}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:13px}

/* timeline */
.blk{display:flex;gap:10px;align-items:stretch;margin:8px 0}
.tcol{width:66px;flex:none;text-align:right;font-size:12px;color:var(--mute);padding-top:11px;font-variant-numeric:tabular-nums;line-height:1.3}
.tcol b{display:block;color:var(--ink);font-size:13px;font-weight:700}
.bc{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:9px 8px 9px 10px;border-radius:16px;cursor:pointer;
  background:color-mix(in srgb,var(--c) 10%,var(--card));border:1px solid var(--line);border-left:5px solid var(--c)}
.blk.done .bc{opacity:.7}
.ico{font-size:21px;width:30px;text-align:center;flex:none}
.gap{display:flex;gap:8px;align-items:center;margin:2px 0;color:var(--mute);font-size:13px}
.gap .tcol{padding:0}
.gap .ln{flex:1;border-top:1.5px dashed var(--line)}
.nowline{display:flex;align-items:center;gap:8px;color:var(--warn);font-size:12px;font-weight:700;margin:8px 0}
.nowline .tcol{padding:0;color:var(--warn)}
.nowline::after{content:'';flex:1;height:2px;background:var(--warn);border-radius:2px;opacity:.7}
.nowcard .pad{display:grid;gap:8px}
.nl{display:flex;align-items:center;gap:10px}
.nl .k{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);width:38px;flex:none}
.nl .v{flex:1;min-width:0}
details.card summary{list-style:none;cursor:pointer}
details.card summary::-webkit-details-marker{display:none}
details.card summary h2::after{content:'▾';margin-left:6px}
details[open].card summary h2::after{content:'▴'}

/* week strip */
.strip{display:flex;align-items:center;gap:4px;margin:10px 0 2px}
.strip .days{display:flex;flex:1;gap:4px}
.dchip{flex:1;border:1px solid transparent;background:none;border-radius:14px;padding:6px 0;display:grid;gap:1px;justify-items:center;font-size:11px;color:var(--mute);font-weight:600}
.dchip b{font-size:16px;color:var(--ink)}
.dchip.today b{color:var(--accent)}
.dchip.on{background:var(--accent);color:var(--accent-ink)}
.dchip.on b{color:var(--accent-ink)}
.dchip i{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.5}
.dchip i.none{opacity:0}

/* inputs */
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
input:disabled{opacity:.45}
.sub input[type=time]{width:auto;padding:1px 6px;border-radius:8px;min-height:30px}
label{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--mute)}
label.inline{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--ink);font-size:15px}
label.inline input{width:20px;height:20px;accent-color:var(--accent)}
.lbl{font-size:13px;font-weight:600;color:var(--mute);margin-bottom:6px}
.stack{display:grid;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
form.add{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:center}
form.add input[name=text]{flex:1}
.btn{border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:11px 16px;white-space:nowrap}
.btn.ghost{background:var(--soft);color:var(--accent)}
.btn.danger{background:var(--warn-soft);color:var(--warn)}
.btn.big{padding:14px;font-size:17px;width:100%}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn.sq{padding:0;width:44px;height:44px;flex:none;display:grid;place-items:center}
.btns{display:flex;gap:8px;flex-wrap:wrap}

/* chips, segmented, swatches */
.pills{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 14px}
.pill{font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 13px;font-size:14px;font-weight:600}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip:disabled{opacity:.5}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:9px;font-weight:600;font-size:14px;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:32px;height:32px;border-radius:50%;border:0;background:var(--c);padding:0}
.sw.on{outline:2.5px solid var(--ink);outline-offset:2px}
.icongrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:4px}
.icongrid button{height:44px;border:0;border-radius:10px;background:var(--bg);font-size:22px}
.icongrid button.on{background:var(--soft);outline:2px solid var(--accent)}
.titlebox{display:flex;gap:8px;align-items:center;padding:8px;border-radius:16px;background:color-mix(in srgb,var(--c) 10%,var(--card));border-left:5px solid var(--c)}
.titlebox input{border:0;background:none;font-size:18px;font-weight:600;padding:8px 4px}
.icobtn{width:48px;height:48px;border:0;border-radius:12px;background:var(--card);font-size:24px;flex:none}

/* week view */
.wday h2{cursor:pointer}
.wday.today{border-color:var(--accent)}
.wrow{display:flex;align-items:center;gap:8px;padding:7px 16px;border-top:1px solid var(--line);font-size:14px;cursor:pointer}
.wrow .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.wrow .t{width:64px;flex:none;color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.wrow.done span:last-child{text-decoration:line-through;color:var(--done)}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin:0 16px 12px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}

/* focus */
.fring{position:relative;width:240px;height:240px;margin:6px auto 14px}
.fring svg{display:block}
.fring .trk{fill:none;stroke:var(--line);stroke-width:10}
.fring .prog{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.fring.brk .prog{stroke:var(--warn)}
.fin{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:2px}
.clock{font-size:52px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
.phase{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.stats b{display:block;font-size:22px}
.center{text-align:center}
.center .btns{justify-content:center}

/* banners, nav, fab, sheet, toast */
.install .x{position:absolute;top:6px;right:6px}
.install p,.banner p{margin:6px 0 10px;font-size:14px;color:var(--mute)}
.install svg{vertical-align:-3px}
.review{border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.review .btns{margin-top:6px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;
  background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs > div{display:flex;width:100%;max-width:560px}
nav button{position:relative;flex:1;border:0;background:none;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600}
nav button.on{color:var(--accent)}
nav .dotn{position:absolute;top:2px;left:calc(50% + 8px);min-width:16px;height:16px;border-radius:8px;background:var(--warn);color:var(--card);font-size:10px;line-height:16px;padding:0 4px}
nav .navadd{flex:none;width:52px;height:52px;margin:-14px 6px 0;border-radius:18px;background:var(--accent);color:var(--accent-ink);
  box-shadow:0 6px 18px rgba(16,24,40,.22);display:grid;place-items:center;padding:0}
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(18,24,21,.42)}
.sheet-panel{position:relative;width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;
  padding:8px 16px calc(24px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-8px;background:var(--card);padding:10px 0;z-index:1}
.sheet-head .link{font-size:16px}
.ob{max-width:520px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
.ob .logo{width:72px;height:72px;border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.ob .logo img{width:100%;display:block}
.ob h1{font-size:30px;margin:16px 0 0;letter-spacing:-.02em}
.steps{font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.07em}
.obnav{display:flex;gap:10px;margin-top:18px}
.obnav .btn{flex:1;padding:14px}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-160%);z-index:40;
  width:min(92vw,440px);background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 16px;font-size:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.22);transition:transform .3s}
#toast.show{transform:translate(-50%,0)}
#toast div{opacity:.85;margin-top:4px}
</style>
</head>
<body>
<div id="ob" hidden></div>
<div id="app" hidden>
  <main class="wrap" id="view"></main>
  <nav class="tabs" aria-label="Sections"><div>
    <button data-a="tab" data-id="today"><span data-icon="sun"></span>Today</button>
    <button data-a="tab" data-id="week"><span data-icon="cal"></span>Week</button>
    <button class="navadd" data-a="add" aria-label="Add something"><span data-icon="plus"></span></button>
    <button data-a="tab" data-id="focus"><span data-icon="timer"></span>Focus</button>
    <button data-a="tab" data-id="me"><span data-icon="user"></span>Me</button>
  </div></nav>
</div>
<div class="sheet" id="sheet" hidden><div class="sheet-bg" data-a="closeSheet"></div><div class="sheet-panel" id="sheetPanel" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="restoreFile" accept=".json,application/json" data-c="restore" hidden>

<script>
'use strict';
/* ---------- helpers ---------- */
const KEY = 'tidyday:v2', OLD_KEY = 'dayboost:v1';
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T00:00'); d.setDate(d.getDate() + n); return ymd(d); };
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00') - new Date(a + 'T00:00')) / 864e5);
const dow = (s) => new Date(s + 'T00:00').getDay();
const startOfWeek = (s) => addDays(s, -((dow(s) + 6) % 7));
const toMin = (s) => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
const fromMin = (m) => `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`;
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const fmtTime = (s) => { if (!s) return ''; let [h, m] = s.split(':').map(Number); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${pad(m)} ${ap}`; };
const fmtDur = (m) => m < 60 ? `${m} min` : m % 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m / 60} hr`;
const fmtDay = (s) => {
  const t = today();
  if (s === t) return 'Today';
  if (s === addDays(t, 1)) return 'Tomorrow';
  if (s === addDays(t, -1)) return 'Yesterday';
  return new Date(s + 'T00:00').toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
};
const longDate = (s) => new Date(s + 'T00:00').toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

const svg = (p, w = 22) => `<svg viewBox="0 0 24 24" width="${w}" height="${w}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I = {
  check: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  bell: svg('<path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>', 18),
  bellOff: svg('<path d="M8.7 3A6 6 0 0 1 18 8c0 2.7.4 4.6 1 6"/><path d="M17 17H3s3-2 3-9c0-.8.1-1.5.4-2.2"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><path d="M3 3l18 18"/>', 18),
  trash: svg('<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/>', 18),
  plus: svg('<path d="M12 5v14M5 12h14"/>', 24),
  share: svg('<path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/>', 16),
  left: svg('<path d="M15 18l-6-6 6-6"/>', 20),
  right: svg('<path d="M9 18l6-6-6-6"/>', 20),
  sun: svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
  cal: svg('<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>'),
  inbox: svg('<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>'),
  timer: svg('<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/>'),
  user: svg('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'),
};

/* Muted, low-saturation task colours. */
const COLORS = { blue: '#5b9bea', green: '#4fb882', purple: '#9b84dd', orange: '#ee9a52', yellow: '#e2bb3d', pink: '#e9829f', teal: '#3fb5aa', grey: '#98a3b0' };

const defaults = () => ({
  v: 2, profile: null, items: coreHabits(), chores: [], fired: {}, lastDay: null, focusLog: {},
  focus: { mode: 'pomo', phase: 'idle', endAt: 0, left: 0, paused: false, taskId: '', rounds: 0, roundsDay: '' },

/* Bring data from the first version of the app forward. */
function migrate(o) {
  const n = defaults();
  n.profile = o.profile || null;
  n.settings.checkinHours = o.settings?.checkinHours ?? 3;
  n.items = (o.habits || []).map((h) => {
    const base = coreHabits().find((c) => c.id === h.id);
    const it = { ...(base || { kind: 'habit', color: 'blue', dur: 15, repeat: { t: 'daily', days: [] }, date: today(), note: '' }),
      id: h.id, icon: h.icon, title: h.name, time: h.time || '', rem: h.reminder ? [0] : [], core: !h.custom, done: {} };
    if (h.goal) Object.assign(it, { goal: h.goal, every: h.repeatHours || 0, until: h.endTime || '21:00' });
    return it;
  });
  for (const d in o.log || {}) for (const id in o.log[d]) { const it = n.items.find((x) => x.id === id); if (it) it.done[d] = o.log[d][id]; }
  for (const d in o.todos || {}) (o.todos[d] || []).forEach((x) => {
    if (x.movedTo) return;
    n.items.push({ id: x.id, kind: 'task', icon: '📝', color: 'blue', title: x.title, date: d, time: x.time || '', dur: 30, repeat: { t: 'none', days: [] },
      rem: x.reminder ? [0] : [], done: x.done ? { [d]: true } : {}, note: '', carried: x.carried || 0, from: x.from || '' });
  });
  (o.appts || []).forEach((a) => n.items.push({ id: a.id, kind: 'appt', icon: '📅', color: 'orange', title: a.title, date: a.date, time: a.time, dur: 60,
    repeat: a.repeat === 'weekly' ? { t: 'weekly', days: [dow(a.date)] } : { t: 'none', days: [] }, rem: a.reminder ? [a.before || 0] : [], done: a.doneDates || {}, note: '' }));
  n.chores = (o.low || []).map((x) => ({ id: x.id, icon: '', title: x.title, every: x.repeat || 0, time: x.time || '', rem: !!x.reminder, done: x.done || null }));
  n.lastDay = o.lastDay;
  return n;
}
function load() {
  try { const r = JSON.parse(localStorage.getItem(KEY)); if (r && r.items) return fill(r); } catch (e) {}
  try { const o = JSON.parse(localStorage.getItem(OLD_KEY)); if (o && o.habits) return migrate(o); } catch (e) {}
  return defaults();
}
function fill(r) { const d = defaults(); return { ...d, ...r, settings: { ...d.settings, ...r.settings }, focus: { ...d.focus, ...r.focus } }; }
let S = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Could not save', 'Storage may be full or blocked.'); } }

const item = (id) => S.items.find((x) => x.id === id);
function occurs(it, d) {
  if (!it.date) return false;
  const r = it.repeat || { t: 'none' };
  if (r.t === 'none') return it.date === d;
  if (d < it.date) return false;
  const w = dow(d);
  if (r.t === 'daily') return true;
  if (r.t === 'weekdays') return w > 0 && w < 6;
  if (r.t === 'weekly') return (r.days && r.days.length ? r.days : [dow(it.date)]).includes(w);
  if (r.t === 'monthly') return +d.slice(8) === +it.date.slice(8);
  return false;
}
const byTime = (a, b) => (a.time || '99').localeCompare(b.time || '99');
const itemsOn = (d) => S.items.filter((it) => occurs(it, d)).sort(byTime);
const count = (it, d) => Number(it.done[d]) || 0;
function isDone(it, d) {
  const v = it.done[d];
  if (it.goal) return (Number(v) || 0) >= it.goal;
  if (it.core && it.id === 'plan') return !!v || S.items.some((x) => x.kind !== 'habit' && x.repeat.t === 'none' && x.date === addDays(d, 1));
  return !!v;
}
const endOf = (it) => toMin(it.time) + (it.dur || 0);
const choreDone = (x, d) => !!x.done && (!x.every || daysBetween(x.done, d) < x.every);
const leftovers = () => S.items.filter((it) => it.kind === 'task' && it.repeat.t === 'none' && it.date && it.date < today() && !it.done[it.date]);
const repeatLabel = (it) => {
  const r = it.repeat || {};
  if (r.t === 'weekly') return 'Every ' + (r.days && r.days.length ? r.days : [dow(it.date)]).sort().map((x) => WD[x]).join(', ');
  return r.t && r.t !== 'none' ? REPEATS[r.t] : '';
};
function remaining(d = today()) {
  const r = itemsOn(d).filter((it) => !isDone(it, d)).map((it) => `${it.icon} ${it.title}${it.goal ? ` (${count(it, d)}/${it.goal})` : ''}${it.time ? ` · ${fmtTime(it.time)}` : ''}`);
  S.chores.forEach((x) => { if (!choreDone(x, d)) r.push(`${x.icon || '◦'} ${x.title}`); });
  return r;
}
function progress(d) { const its = itemsOn(d); return { done: its.filter((it) => isDone(it, d)).length, total: its.length }; }
const dayComplete = (d) => { const h = S.items.filter((it) => it.kind === 'habit' && occurs(it, d)); return h.length && h.every((it) => isDone(it, d)); };
function streak() {
  let n = 0, d = today();
  if (dayComplete(d)) n++;
  d = addDays(d, -1);
  while (n < 3650 && dayComplete(d)) { n++; d = addDays(d, -1); }
  return n;
}
function carry(it, to) { it.from = it.from || it.date; it.carried = (it.carried || 0) + 1; it.date = to; }
function rollover() {
  const t = today();
  if (S.lastDay === t) return false;
  if (S.settings.autoCarry) leftovers().forEach((it) => carry(it, t));
  const cutoff = addDays(t, -2);
  for (const k in S.fired) if (k.slice(0, 10) < cutoff) delete S.fired[k];
  S.lastDay = t;
  save();
  return true;
}

/* ---------- theme & sound ---------- */
const darkMQ = matchMedia('(prefers-color-scheme: dark)');
function applyTheme() {
  const root = document.documentElement, th = S.settings.theme;
  if (th === 'auto') root.removeAttribute('data-theme'); else root.dataset.theme = th;
  const dark = th === 'dark' || (th === 'auto' && darkMQ.matches);
  const [l, d] = ACCENTS[S.settings.accent] || ACCENTS.blue;
  root.style.setProperty('--accent', dark ? d : l);
  root.style.setProperty('--accent-ink', dark ? '#0d1726' : '#ffffff');
  document.querySelectorAll('meta[name=theme-color]').forEach((m) => m.setAttribute('content', dark ? '#121418' : '#f5f7fa'));
}
darkMQ.addEventListener?.('change', applyTheme);

const SOUNDS = { chime: [[659, 0], [880, .16], [1319, .32]], bell: [[523, 0], [784, 0], [1047, 0]], soft: [[440, 0], [554, .28]], drop: [[988, 0], [740, .1]] };
let actx;
function ac() { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); return actx; }
document.addEventListener('pointerdown', () => { try { ac(); } catch (e) {} }, { once: true });
function play(name = S.settings.sound, vol = .18) {
  if (!name || name === 'off' || !SOUNDS[name]) return;
  try {
    const c = ac(), t0 = c.currentTime;
    SOUNDS[name].forEach(([f, dt]) => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t0 + dt);
      g.gain.linearRampToValueAtTime(vol, t0 + dt + .02);
      g.gain.exponentialRampToValueAtTime(.001, t0 + dt + 1.6);
      o.connect(g).connect(c.destination); o.start(t0 + dt); o.stop(t0 + dt + 1.7);
    });
  } catch (e) {}
}

/* ---------- notifications & reminders ---------- */
let deferredPrompt = null;
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (!/android/i.test(navigator.userAgent) && navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isMobile = isIOS || /android|mobile/i.test(navigator.userAgent);
function notifState() {
  if (!('Notification' in window)) return isIOS && !standalone ? 'ios-install' : 'unsupported';
  return Notification.permission;
}
async function askNotif() {
  const st = notifState();
  if (st === 'ios-install') { toast('Install first for reminders', 'On iPhone, add Tidy Day to your Home Screen, then open it from there.'); return; }
  if (st === 'unsupported') { toast('This browser can’t show notifications', 'Reminders will still appear inside the app.'); return; }
  if (st === 'denied') { toast('Notifications are blocked', 'Allow them for this site in your phone/browser settings.'); return; }
  if (st === 'default') {
    const p = await Notification.requestPermission();
    if (p === 'granted') notify('Reminders are on', 'You’ll get gentle nudges at the times you set.', 'welcome');
    render();
  }
}
async function notify(title, body, tag) {
  toast(title, body);
  play();
  if (navigator.vibrate) navigator.vibrate([120, 80, 120]);
  if (notifState() !== 'granted') return;
  const opts = { body, tag, icon: 'icons/icon-192.png', badge: 'icons/icon-192.png', renotify: true };
  try {
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if (reg) return reg.showNotification(title, opts);
  } catch (e) {}
  try { new Notification(title, opts); } catch (e) {}
}
const WINDOW = 20; // a missed reminder still fires if the app is opened within 20 min
function checkinSlots() {
  const { checkinHours: n, dayStart, dayEnd } = S.settings, out = [];
  if (!n) return out;
  for (let t = toMin(dayStart) + n * 60; t <= toMin(dayEnd); t += n * 60) out.push(t);
  return out;
}
function tick() {
  if (!S.profile) return;
  const newDay = rollover();
  const d = today(), m = nowMin();
  const due = (key, t) => m >= t && m < t + WINDOW && !S.fired[key];
  const fire = (key, title, body) => { S.fired[key] = 1; notify(title, body, key); };

  S.items.forEach((it) => {
    if (!it.time || !it.rem || !it.rem.length) return;
    [d, addDays(d, 1)].forEach((od) => {
      if (!occurs(it, od) || isDone(it, od)) return;
      it.rem.forEach((b) => {
        const starts = [toMin(it.time)];
        if (b === 0 && it.every) for (let t = starts[0] + it.every * 60; t <= toMin(it.until || '21:00'); t += it.every * 60) starts.push(t);
        starts.forEach((st) => {
          const rt = new Date(new Date(`${od}T${fromMin(st)}`) - b * 60000);
          if (ymd(rt) !== d) return;
          const k = `${d}|i|${it.id}|${od}|${b}|${st}`;
          if (!due(k, rt.getHours() * 60 + rt.getMinutes())) return;
          const body = b
            ? `${b >= 1440 ? 'Tomorrow' : `In ${fmtDur(b)}`} at ${fmtTime(it.time)}${it.dur ? ` · ${fmtDur(it.dur)}` : ''}`
            : it.goal ? `${count(it, od)} of ${it.goal} glasses so far.` : it.note || (it.dur ? `${fmtDur(it.dur)} block. Tap ✓ when done.` : 'It’s time.');
          fire(k, `${it.icon} ${it.title}`, body);
        });
      });
    });
  });
  S.chores.forEach((x) => {
    if (!x.rem || !x.time || choreDone(x, d)) return;
    const k = `${d}|c|${x.id}`;
    if (due(k, toMin(x.time))) fire(k, `${x.icon || '🧹'} ${x.title}`, 'Low priority, but it still needs doing.');
  });
  checkinSlots().forEach((t) => {
    const k = `${d}|s|${t}`;
    if (!due(k, t)) return;
    const r = remaining(d);
    if (!r.length) { S.fired[k] = 1; return; }
    fire(k, `Check-in: ${r.length} left today`, r.slice(0, 6).join('\n') + (r.length > 6 ? `\n+${r.length - 6} more` : ''));
  });
  save();
  const typing = document.activeElement && document.activeElement.matches('input,select,textarea');
  if ((newDay || tab === 'today') && $('#sheet').hidden && !typing) render();
}

/* ---------- focus timer ---------- */
const F = () => S.focus;
const fTotal = () => (F().phase === 'break' ? MODES[F().mode].b : MODES[F().mode].w) * 60;
const fLeft = () => F().phase === 'idle' ? MODES[F().mode].w * 60 : F().paused ? F().left : Math.max(0, Math.round((F().endAt - Date.now()) / 1000));
const mmss = (s) => `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;
function finishPhase(natural) {
  const f = F(), m = MODES[f.mode], t = today();
  if (f.phase === 'work') {
    const mins = natural ? m.w : Math.round((fTotal() - fLeft()) / 60);
    S.focusLog[t] = (S.focusLog[t] || 0) + mins;
    if (f.roundsDay !== t) { f.rounds = 0; f.roundsDay = t; }
    f.rounds++;
    if (natural) notify('Focus block done 🌿', `Nice. Take a ${m.b}-minute break.`, 'focus');
    Object.assign(f, { phase: 'break', endAt: Date.now() + m.b * 60000, paused: false });
  } else {
    if (natural) notify('Break over', 'Ready for the next focus block?', 'focus');
    f.phase = 'idle';
  }
  save(); render();
}
function focusTick() {
  const f = F();
  if (f.phase !== 'idle' && !f.paused && Date.now() >= f.endAt) return finishPhase(true);
  const el = $('#fclock');
  if (el) {
    const left = fLeft(), C = 2 * Math.PI * 108;
    el.textContent = mmss(left);
    const p = $('#fprog'); if (p) p.setAttribute('stroke-dashoffset', C * (1 - (f.phase === 'idle' ? 0 : 1 - left / fTotal())));
  }
  document.title = f.phase !== 'idle' && !f.paused ? `${mmss(fLeft())} · ${f.phase === 'work' ? 'Focus' : 'Break'}` : 'Tidy Day';
}

/* ---------- UI pieces ---------- */
let toastTimer;

  el.innerHTML = `<strong>${esc(title)}</strong>${body ? `<div>${esc(body).replace(/\n/g, '<br>')}</div>` : ''}`;
  el.classList.add('show');

}
const bellBtn = (a, id, on) => `<button class="icon-btn bell ${on ? 'on' : ''}" data-a="${a}" data-id="${id}" aria-pressed="${!!on}" aria-label="${on ? 'Reminder on' : 'Reminder off'}">${on ? I.bell : I.bellOff}</button>`;
const delBtn = (a, id) => `<button class="icon-btn" data-a="${a}" data-id="${id}" aria-label="Delete">${I.trash}</button>`;
const chip = (on, a, id, label, extra = '') => `<button type="button" class="chip ${on ? 'on' : ''}" data-a="${a}" data-id="${id}" ${extra}>${label}</button>`;

  return `<div class="ring" aria-label="${done} of ${total} done"><svg viewBox="0 0 62 62" width="62" height="62"><circle cx="31" cy="31" r="25" class="trk"/><circle cx="31" cy="31" r="25" class="bar" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}" transform="rotate(-90 31 31)"/></svg><span>${Math.round(pct * 100)}%</span></div>`;
}

function block(it, d, timed = true) {
  const done = isDone(it, d), n = count(it, d);
  const check = it.goal
    ? `<button class="check water" data-a="done" data-id="${it.id}" data-d="${d}" aria-label="Add a glass">${done ? I.check : n}</button>`
    : `<button class="check" data-a="done" data-id="${it.id}" data-d="${d}" aria-label="Mark done">${I.check}</button>`;
  const bits = [];
  if (it.dur) bits.push(fmtDur(it.dur));
  if (it.goal) bits.push(`${n}/${it.goal} glasses`);
  const rl = repeatLabel(it); if (rl && it.kind !== 'habit') bits.push(rl);
  if (it.kind === 'appt') bits.push('Appointment');
  const on = it.time && it.rem.length;
  return `<div class="blk ${done ? 'done' : ''}" style="--c:${col(it.color)}">
    ${timed ? `<div class="tcol"><b>${fmtTime(it.time)}</b>${it.dur ? `<span>${fmtTime(fromMin(Math.min(endOf(it), 1439)))}</span>` : ''}</div>` : ''}
    <div class="bc" data-a="edit" data-id="${it.id}" role="button" tabindex="0" aria-label="Edit ${esc(it.title)}">
      <span class="ico">${esc(it.icon)}</span>
      <div class="body"><div class="title">${esc(it.title)}</div>

    </div></div>`;
}
function weekStrip() {
  const mon = startOfWeek(selDay), t = today();
  const days = Array.from({ length: 7 }, (_, i) => addDays(mon, i));
  return `<div class="strip"><button class="icon-btn" data-a="shiftDay" data-id="-7" aria-label="Previous week">${I.left}</button><div class="days">
    ${days.map((d) => {
      const busy = S.items.some((it) => it.kind !== 'habit' && occurs(it, d));
      return `<button class="dchip ${d === selDay ? 'on' : ''} ${d === t ? 'today' : ''}" data-a="pickDay" data-id="${d}">${WD[dow(d)]}<b>${+d.slice(8)}</b><i class="${busy ? '' : 'none'}"></i></button>`;
    }).join('')}</div><button class="icon-btn" data-a="shiftDay" data-id="7" aria-label="Next week">${I.right}</button></div>`;
}
function nowCard() {
  const d = today(), nm = nowMin();
  const its = itemsOn(d).filter((i) => i.time && !isDone(i, d));
  const cur = its.find((i) => i.dur && toMin(i.time) <= nm && nm < endOf(i));
  const next = its.find((i) => toMin(i.time) > nm);
  const lines = [];
  if (cur) lines.push(`<div class="nl"><span class="k">Now</span><span class="v">${esc(cur.icon)} <b>${esc(cur.title)}</b><br><span class="note">${fmtDur(endOf(cur) - nm)} left</span></span><button class="btn sm" data-a="focusItem" data-id="${cur.id}">⏱ Focus</button></div>`);
  if (next) {
    const gap = toMin(next.time) - nm;
    lines.push(`<div class="nl"><span class="k">Next</span><span class="v">${esc(next.icon)} <b>${esc(next.title)}</b><br><span class="note">${fmtTime(next.time)} · in ${fmtDur(gap)}${!cur && gap >= 30 ? ' · you’re free until then' : ''}</span></span></div>`);
  }
  if (!lines.length) lines.push(`<div class="nl"><span class="k">Now</span><span class="v">Nothing else on the timeline today. Enjoy the free time 🌿</span></div>`);
  return `<section class="card nowcard"><div class="pad">${lines.join('')}</div></section>`;
}
function timeline(d) {
  const its = itemsOn(d).filter((i) => i.time);
  if (!its.length) return `<div class="card"><div class="pad note">Nothing on the timeline yet. Tap ＋ to add a task, habit or appointment.</div></div>`;
  const isT = d === today(), nm = nowMin(), dayEnd = toMin(S.settings.dayEnd);
  let html = '', prevEnd = null, nowShown = !isT;
  const gapRow = (from, mins, until) => `<div class="gap"><span class="tcol"></span><span class="ln"></span><span>☕ ${fmtDur(mins)} free${until ? ' until bedtime' : ''}</span><button class="link" data-a="addAt" data-id="${fromMin(from)}" data-d="${d}">+ Plan</button><span class="ln"></span></div>`;
  const nowRow = () => `<div class="nowline"><span class="tcol">${fmtTime(fromMin(nm))}</span>Now</div>`;
  its.forEach((it) => {
    const s = toMin(it.time);
    if (prevEnd != null && s - prevEnd >= 60) html += gapRow(prevEnd, s - prevEnd);
    if (!nowShown && s > nm) { html += nowRow(); nowShown = true; }
    html += block(it, d);
    prevEnd = Math.max(prevEnd ?? 0, endOf(it));
  });
  if (!nowShown) html += nowRow();
  if (prevEnd <= dayEnd - 60) html += gapRow(prevEnd, dayEnd - prevEnd, true);
  return `<div class="tl">${html}</div>`;
}
function choreRow(x, d) {
  const done = choreDone(x, d);
  return `<div class="row ${done ? 'done' : ''}"><button class="check" data-a="chore" data-id="${x.id}" aria-label="Mark done">${I.check}</button>
    <div class="body"><div class="title">${esc(x.icon)} ${esc(x.title)}</div><div class="sub"><input type="time" value="${x.time || ''}" data-c="ctime" data-id="${x.id}" aria-label="Reminder time">

    ${bellBtn('cbell', x.id, x.rem)}${delBtn('cdel', x.id)}</div>`;
}

/* ---------- add / edit sheet ---------- */
let D = null, showIcons = false, moreOpen = false;
function openSheet(it, preset = {}) {
  D = it ? JSON.parse(JSON.stringify(it)) : {
    id: null, kind: 'task', title: '', icon: '📝', color: 'blue', date: selDay, time: '', dur: 30,
    repeat: { t: 'none', days: [] }, rem: [0], done: {}, note: '', ...preset,

  D._new = !it; showIcons = false; moreOpen = false;

  $('#sheet').hidden = false;
  document.body.style.overflow = 'hidden';
  if (D._new) setTimeout(() => $('#sheet input[data-s=title]')?.focus(), 60);
}
function closeSheet() { $('#sheet').hidden = true; D = null; document.body.style.overflow = ''; }
function renderSheet() {
  const r = D.repeat, isHabit = D.kind === 'habit', t = today(), tm = addDays(t, 1);
  const when = !D.date ? 'someday' : D.date === t ? 'today' : D.date === tm ? 'tomorrow' : 'date';

  $('#sheetPanel').innerHTML = `<form data-f="saveItem" class="stack">

    <div><div class="lbl">${isHabit || r.t !== 'none' ? 'Starting' : 'When'}</div><div class="chips wrap">
      ${chip(when === 'today', 'setWhen', 'today', 'Today')}${chip(when === 'tomorrow', 'setWhen', 'tomorrow', 'Tomorrow')}${chip(when === 'date', 'setWhen', 'date', when === 'date' ? esc(fmtDay(D.date)) : 'Pick a day')}
      ${isHabit || r.t !== 'none' ? '' : chip(when === 'someday', 'setWhen', 'someday', 'Someday')}</div>
      ${when === 'date' ? `<input type="date" data-s="date" value="${D.date}" style="margin-top:8px" aria-label="Date">` : ''}</div>

function saveDraft() {
  if (!D.title.trim()) { toast('Give it a name first'); return; }
  const it = { ...D, title: D.title.trim() };
  delete it._new;
  if (!it.date) it.time = '';
  if (it.repeat.t === 'weekly' && !it.repeat.days.length) it.repeat.days = [dow(it.date || today())];
  if (D._new) { it.id = uid(); S.items.push(it); } else S.items[S.items.findIndex((x) => x.id === it.id)] = it;
  save(); closeSheet(); render();
  toast(D?._new === false ? 'Saved' : 'Saved', it.date ? `${fmtDay(it.date)}${it.time ? ` at ${fmtTime(it.time)}` : ''}` : 'In your Inbox');
  if (it.time && it.rem.length) askNotif();
}

  if (ob.step === 1) return `<div class="ob">
    <div class="steps">Step 2 of 3</div><h1>Your non-negotiables</h1>
    <p class="lead">The daily basics everyone should hit. Set a time that suits you and tap the bell 🔔 for a reminder. You can fine-tune each one later.</p>
    <section class="card">${S.items.filter((i) => i.kind === 'habit').map((h) => `<div class="row"><span class="ico">${esc(h.icon)}</span><div class="body"><div class="title">${esc(h.title)}</div>
      <div class="sub"><input type="time" value="${h.time || ''}" data-c="itime" data-id="${h.id}" aria-label="Time">${h.every ? `<span>then every ${h.every}h</span>` : ''}</div></div>${bellBtn('ibell', h.id, h.time && h.rem.length)}</div>`).join('')}</section>
    <div class="obnav"><button class="btn ghost" data-a="obStep" data-id="0">Back</button><button class="btn" data-a="obStep" data-id="2">Continue</button></div></div>`;
  return `<div class="ob">
    <div class="steps">Step 3 of 3</div><h1>Low priority, still needs doing</h1>
    <p class="lead">Pick the chores you want to keep track of. You can add more any time.</p>
    <div class="chips wrap">${CHORE_SUGGESTIONS.map(([ic, t], i) => chip(ob.pick.has(t), 'obPick', i, `${ic} ${t}`)).join('')}</div>
    <section class="card"><div class="pad stack">
      <label>Remind me what’s left<select data-c="checkin">${[0, 2, 3, 4, 6].map((n) => `<option value="${n}" ${n === S.settings.checkinHours ? 'selected' : ''}>${n ? `Every ${n} hours` : 'Off'}</option>`).join('')}</select></label>
      <div><div class="lbl">Theme</div><div class="seg">${['auto', 'light', 'dark'].map((k) => `<button class="${S.settings.theme === k ? 'on' : ''}" data-a="theme" data-id="${k}">${k[0].toUpperCase() + k.slice(1)}</button>`).join('')}</div></div>
      ${notifState() === 'granted' ? '<div>🔔 Notifications are on</div>' : `<button class="btn ghost" data-a="notif">🔔 Allow notifications</button>`}
    </div></section>
    <div class="obnav"><button class="btn ghost" data-a="obStep" data-id="1">Back</button><button class="btn" data-a="obDone">Start my day</button></div></div>`;
}

/* ---------- render ---------- */
function render() {
  applyTheme();
  if (!S.profile) {
    $('#app').hidden = true; $('#ob').hidden = false;
    $('#ob').innerHTML = vOnboard();
    return;
  }
  $('#ob').hidden = true; $('#app').hidden = false;
  $('#view').innerHTML = { today: vToday, week: vWeek, focus: vFocus, me: vMe }[tab]();
  document.querySelectorAll('nav [data-a=tab]').forEach((b) => b.classList.toggle('on', b.dataset.id === tab));
}
document.querySelectorAll('[data-icon]').forEach((el) => { el.innerHTML = I[el.dataset.icon]; });

/* ---------- export ---------- */
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
}
function exportICS() {
  const tx = (s) => String(s).replace(/[\\;,]/g, (m) => '\\' + m).replace(/\n/g, '\\n');
  const dt = (date, time) => date.replace(/-/g, '') + 'T' + time.replace(':', '') + '00';
  const stamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
  const BY = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'];
  const rrule = (it) => ({
    none: null, daily: 'FREQ=DAILY', weekdays: 'FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR', monthly: 'FREQ=MONTHLY',
    weekly: 'FREQ=WEEKLY;BYDAY=' + (it.repeat.days.length ? it.repeat.days : [dow(it.date)]).map((x) => BY[x]).join(','),
  })[it.repeat.t];
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//TidyDay//EN', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:Tidy Day'];
  const t = today();
  let n = 0;
  S.items.forEach((it) => {
    if (!it.date || !it.time || !it.rem.length) return;
    if (it.repeat.t === 'none' && it.date < t) return;
    const start = it.repeat.t === 'none' || it.date > t ? it.date : t;
    const starts = [it.time];
    if (it.every) for (let m = toMin(it.time) + it.every * 60; m <= toMin(it.until || '21:00'); m += it.every * 60) starts.push(fromMin(m));
    starts.forEach((tm, i) => {
      n++;
      L.push('BEGIN:VEVENT', `UID:${it.id}-${i}@tidyday`, `DTSTAMP:${stamp}`, `DTSTART:${dt(start, tm)}`, `DURATION:PT${it.dur || 15}M`, `SUMMARY:${tx(`${it.icon} ${it.title}`)}`);
      const rr = rrule(it); if (rr) L.push(`RRULE:${rr}`);
      (i ? [0] : it.rem).forEach((b) => L.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${tx(it.title)}`, `TRIGGER:-PT${b}M`, 'END:VALARM'));
      L.push('END:VEVENT');
    });
  });
  if (!n) return toast('Nothing to export', 'Give an item a time and turn on its reminder first.');
  L.push('END:VCALENDAR');
  download('tidyday-reminders.ics', L.join('\r\n'), 'text/calendar');
  toast('Calendar file ready', 'Open it and choose “Add all” to put your reminders in your phone’s calendar.');
}

/* ---------- actions ---------- */
const A = {
  tab(id) { tab = id; if (id === 'today') selDay = selDay || today(); render(); scrollTo(0, 0); },
  pickDay(id) { selDay = id; render(); },
  shiftDay(n) { selDay = addDays(selDay, +n); render(); },
  shiftWeek(n) { weekStart = +n ? addDays(weekStart || startOfWeek(today()), +n) : null; render(); },
  openDay(id) { selDay = id; tab = 'today'; render(); scrollTo(0, 0); },
  add() { if (tab !== 'week') tab = 'today'; render(); openSheet(null); },
  addAt(time, d) { openSheet(null, { date: d, time }); },
  addHabit() { openSheet(null, { kind: 'habit', icon: '⭐', date: today(), time: '08:00', dur: 15, repeat: { t: 'daily', days: [] } }); moreOpen = true; renderSheet(); },
  edit(id) { const it = item(id); if (it) openSheet(it); },
  done(id, d) {
    const it = item(id);
    if (it.goal) { const n = count(it, d); it.done[d] = n >= it.goal ? it.goal - 1 : n + 1; if (it.done[d] === it.goal) toast('💧 Water goal reached!'); }
    else it.done[d] = !it.done[d];
    if (isDone(it, d)) play('drop', .12);
    save(); render();
  },
  ibell(id, d, b) {
    const it = item(id);
    if (!it.time) return openSheet(it);
    it.rem = it.rem.length ? [] : [it.kind === 'appt' ? 60 : 0];
    save(); render(); if (it.rem.length) askNotif();
  },
  delItem(id) {
    const it = item(id);
    if (!confirm(`Delete “${it.title}”${it.repeat.t !== 'none' ? ' and all its repeats' : ''}?`)) return;
    S.items = S.items.filter((x) => x.id !== id); save(); closeSheet(); render();
  },
  toDay(id, n) { const it = item(id); it.date = addDays(today(), +n); save(); render(); toast(`Moved to ${fmtDay(it.date)}`, 'Tap it on the timeline to give it a time.'); },
  rv(id, where) {
    const it = item(id), t = today();
    if (where === 'drop') S.items = S.items.filter((x) => x.id !== id);
    else if (where === 'inbox') { it.date = null; it.time = ''; }
    else carry(it, where === 'today' ? t : addDays(t, 1));
    save(); render();
  },
  rvAll() { leftovers().forEach((it) => carry(it, today())); save(); render(); toast('Moved to today'); },
  chore(id) { const x = S.chores.find((x) => x.id === id); x.done = choreDone(x, today()) ? null : today(); if (x.done) play('drop', .12); save(); render(); },
  cbell(id, d, b) {
    const x = S.chores.find((x) => x.id === id);
    if (!x.time && !x.rem) { toast('Pick a time first'); const i = b.closest('.row').querySelector('input[type=time]'); i.focus(); try { i.showPicker(); } catch (e) {} return; }
    x.rem = !x.rem; save(); render(); if (x.rem) askNotif();
  },
  cdel(id) { S.chores = S.chores.filter((x) => x.id !== id); save(); render(); },
  // sheet
  closeSheet,
  toggleIcons() { showIcons = !showIcons; renderSheet(); },
  toggleMore() { moreOpen = !moreOpen; renderSheet(); },
  setWhen(w) {
    const t = today();
    if (w === 'someday') { D.date = null; D.time = ''; }
    else if (w === 'today') D.date = t;
    else if (w === 'tomorrow') D.date = addDays(t, 1);
    else if (!D.date || D.date <= addDays(t, 1)) D.date = addDays(t, 2);
    renderSheet();
  },
  quickRem() { if (!D.time) return; D.rem = D.rem.length ? [] : [D.kind === 'appt' ? 60 : 0]; renderSheet(); },
  setIcon(v) { D.icon = v; showIcons = false; renderSheet(); },
  setKind(k) {
    D.kind = k;
    if (k === 'habit' && D.repeat.t === 'none') D.repeat = { t: 'daily', days: [] };
    if (k === 'habit' && !D.date) D.date = today();
    if (k === 'appt') { D.rem = [60]; if (D.icon === '📝') D.icon = '📅'; if (D.color === 'blue') D.color = 'orange'; if (!D.date) D.date = selDay; }
    renderSheet();
  },
  setColor(c) { D.color = c; renderSheet(); },
  setDur(m) { D.dur = +m; renderSheet(); },
  setRepeat(t) { D.repeat = { t, days: t === 'weekly' ? [dow(D.date || today())] : [] }; if (t !== 'none' && !D.date) D.date = today(); renderSheet(); },
  setWday(w) { w = +w; const days = D.repeat.days.length ? D.repeat.days : [dow(D.date || today())]; D.repeat.days = days.includes(w) ? days.filter((x) => x !== w) : [...days, w]; renderSheet(); },
  toggleRem(m) { m = +m; D.rem = D.rem.includes(m) ? D.rem.filter((x) => x !== m) : [...D.rem, m].sort((a, b) => a - b); renderSheet(); },
  focusItem(id) { closeSheet(); S.focus.taskId = id; tab = 'focus'; save(); render(); scrollTo(0, 0); },
  // focus
  fMode(k) { S.focus.mode = k; save(); render(); },
  fStart() { Object.assign(S.focus, { phase: 'work', endAt: Date.now() + MODES[S.focus.mode].w * 60000, paused: false }); save(); render(); if (notifState() === 'default') askNotif(); },
  fPause() { S.focus.left = fLeft(); S.focus.paused = true; save(); render(); },
  fResume() { S.focus.endAt = Date.now() + S.focus.left * 1000; S.focus.paused = false; save(); render(); },
  fSkip() { finishPhase(false); },
  fReset() { S.focus.phase = 'idle'; S.focus.paused = false; save(); render(); },
  // settings
  theme(k) { S.settings.theme = k; save(); render(); },
  accent(k) { S.settings.accent = k; save(); render(); },
  sound(k) { S.settings.sound = k; save(); render(); play(k); },
  notif() { askNotif(); },
  test() { notify('🔔 Test reminder', 'If you can see this, reminders work.', 'test'); },
  ics: exportICS,
  install() { if (!deferredPrompt) return; deferredPrompt.prompt(); deferredPrompt.userChoice.finally(() => { deferredPrompt = null; render(); }); },
  hideInstall() { S.settings.hideInstall = true; save(); render(); },
  backup() { download(`tidyday-backup-${today()}.json`, JSON.stringify(S, null, 1), 'application/json'); },
  restorePick() { $('#restoreFile').click(); },
  reset() { if (confirm('Erase all Tidy Day data on this phone? This can’t be undone.')) { localStorage.removeItem(KEY); localStorage.removeItem(OLD_KEY); location.reload(); } },
  // onboarding
  obStep(id) { ob.step = Number(id); render(); scrollTo(0, 0); },
  obPick(i) { const t = CHORE_SUGGESTIONS[i][1]; ob.pick.has(t) ? ob.pick.delete(t) : ob.pick.add(t); render(); },
  obDone() {
    S.profile = { name: ob.name, age: ob.age };
    CHORE_SUGGESTIONS.forEach(([icon, title, every]) => { if (ob.pick.has(title)) S.chores.push({ id: uid(), icon, title, every, time: '', rem: false, done: null }); });
    S.lastDay = today();
    save(); tab = 'today'; selDay = today(); render(); scrollTo(0, 0);
    navigator.storage?.persist?.();
  },
};
const C = {
  itime(id, v) { const it = item(id); it.time = v; if (!v) it.rem = []; save(); render(); },
  ctime(id, v) { const x = S.chores.find((x) => x.id === id); x.time = v; x.rem = !!v; save(); render(); },
  fTask(id, v) { S.focus.taskId = v; save(); render(); },
  pname(id, v) { if (v.trim()) { S.profile.name = v.trim(); save(); } },
  page(id, v) { S.profile.age = v; save(); },
  checkin(id, v) { S.settings.checkinHours = Number(v); save(); },
  dayStart(id, v) { if (v) { S.settings.dayStart = v; save(); } },
  dayEnd(id, v) { if (v) { S.settings.dayEnd = v; save(); } },
  autoCarry(id, v, el) { S.settings.autoCarry = el.checked; save(); },
  restore(id, v, el) {
    const f = el.files[0]; if (!f) return;
    f.text().then((txt) => {
      const o = JSON.parse(txt);
      if (o && Array.isArray(o.items)) S = fill(o);
      else if (o && Array.isArray(o.habits)) S = migrate(o);
      else throw new Error('bad file');
      save(); tab = 'today'; selDay = today(); render(); toast('Backup restored ✅');
    }).catch(() => toast('That file isn’t a Tidy Day backup')).finally(() => { el.value = ''; });
  },
};
const FORMS = {
  saveItem: saveDraft,
  capture(f) {
    const text = f.elements.text.value.trim(); if (!text) return;
    S.items.push({ id: uid(), kind: 'task', title: text, icon: '📝', color: 'blue', date: null, time: '', dur: 30, repeat: { t: 'none', days: [] }, rem: [0], done: {}, note: '' });
    save(); render(); $('form[data-f=capture] input')?.focus();
  },
  addChore(f) {
    const text = f.elements.text.value.trim(); if (!text) return;
    S.chores.push({ id: uid(), icon: '', title: text, every: Number(f.elements.every.value), time: '', rem: false, done: null });
    save(); render();
  },
  ob0(f) { ob.name = f.elements.name.value.trim(); ob.age = f.elements.age.value; if (ob.name) A.obStep(1); },
};
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-a]');
  if (!b || !A[b.dataset.a]) return;
  e.preventDefault();
  A[b.dataset.a](b.dataset.id, b.dataset.d, b);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && D) closeSheet();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.bc[data-a]')) { e.preventDefault(); A.edit(e.target.dataset.id); }
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (D && t.dataset.s && t.type !== 'checkbox') D[t.dataset.s] = ['goal', 'every'].includes(t.dataset.s) ? Number(t.value) : t.value;
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (D && t.dataset.s) {
    if (t.dataset.s === 'inbox') { D.date = t.checked ? null : selDay; if (!D.date) D.time = ''; renderSheet(); }
    else if (t.dataset.s === 'time' || t.dataset.s === 'every') renderSheet();
    return;
  }
  if (t.dataset.c && C[t.dataset.c]) C[t.dataset.c](t.dataset.id, t.value, t);
});
document.addEventListener('submit', (e) => {
  const f = e.target;
  if (f.dataset.f && FORMS[f.dataset.f]) { e.preventDefault(); FORMS[f.dataset.f](f); }
});
$('#toast').addEventListener('click', () => $('#toast').classList.remove('show'));

/* ---------- boot ---------- */
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; render(); });
window.addEventListener('appinstalled', () => { deferredPrompt = null; toast('Tidy Day installed 🎉', 'Open it from your home screen.'); render(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); focusTick(); if ($('#sheet').hidden) render(); } });
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
rollover();
render();
tick();
setInterval(tick, 30000);
setInterval(focusTick, 1000);
</script>
