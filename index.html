<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DayBoost</title>
<meta name="description" content="Daily non-negotiables, to-dos, appointments and reminders. Your data stays on your phone.">
<meta name="theme-color" content="#0f8b6c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DayBoost">
<style>
:root{
  --bg:#f5f4ef;--card:#fff;--ink:#1d2421;--mute:#6b746f;--line:#e7e5dd;
  --accent:#0f8b6c;--accent-ink:#fff;--soft:#e1f2eb;
  --warn:#b4480f;--warn-soft:#fcece1;--done:#a0a8a3;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1211;--card:#181c1a;--ink:#e7ebe8;--mute:#98a29c;--line:#28302c;
    --accent:#3cc79e;--accent-ink:#05261b;--soft:#16322a;
    --warn:#f59a5b;--warn-soft:#30200f;--done:#5d6862;--shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 24px}

/* header */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 4px}
.hdr .date{font-size:13px;color:var(--mute);font-weight:500}
.hdr h1,.ttl{font-size:26px;line-height:1.15;margin:2px 0 0;letter-spacing:-.01em}
.streak{font-size:13px;color:var(--warn);font-weight:600;margin-top:4px}
.ring{position:relative;width:62px;height:62px;flex:none}
.ring svg{display:block}
.ring .trk{fill:none;stroke:var(--line);stroke-width:6}
.ring .bar{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:700}
.lead{color:var(--mute);margin:6px 0 10px}

/* cards & rows */
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);margin:14px 0;overflow:hidden}
.card h2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0;padding:14px 16px 8px;
  font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.card h2 .count{font-variant-numeric:tabular-nums}
.pad{padding:12px 16px}
.note{font-size:13px;color:var(--mute)}
.empty{padding:4px 16px 14px;font-size:14px;color:var(--mute)}
.row{display:flex;align-items:center;gap:12px;padding:10px 8px 10px 14px;border-top:1px solid var(--line)}
.card h2 + .row,.card h2 + .note + .row{border-top:0}
.body{flex:1;min-width:0}
.title{font-weight:500;overflow-wrap:anywhere}
.desc{font-size:13px;color:var(--mute)}
.sub{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:4px;font-size:13px;color:var(--mute)}
.row.done .title{text-decoration:line-through;color:var(--done)}
.check{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:none;
  display:grid;place-items:center;color:transparent;padding:0;font-size:12px;font-weight:700;transition:.15s}
.check:active{transform:scale(.9)}
.check.water{color:var(--accent);border-color:var(--soft);background:var(--soft)}
.row.done .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.icon-btn{flex:none;width:38px;height:38px;border:0;border-radius:12px;background:none;color:var(--mute);display:grid;place-items:center;padding:0}
.icon-btn:active{background:var(--line)}
.bell.on{color:var(--accent);background:var(--soft)}
.badge{font-size:11px;font-weight:700;background:var(--warn-soft);color:var(--warn);padding:2px 8px;border-radius:99px}
.tag{font-size:11px;font-weight:600;background:var(--bg);border:1px solid var(--line);padding:1px 8px;border-radius:99px}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:13px}

/* inputs */
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;width:100%}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.sub input[type=time]{width:auto;padding:2px 6px;border-radius:8px;font-size:16px;min-height:30px;color:var(--ink)}
.sub select{width:auto;padding:2px 6px;border-radius:8px}
input.plain{border:0;background:none;padding:0;font-weight:500;border-radius:4px}
input.emoji{width:46px;flex:none;text-align:center;font-size:20px;padding:6px 0}
label{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--mute)}
.stack{display:grid;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
form.add{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:center}
form.add input[name=text]{flex:1}
form.add input[type=time]{width:112px;flex:none;padding:10px 6px}
.btn{border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:11px 16px;white-space:nowrap}
.btn.ghost{background:var(--soft);color:var(--accent)}
.btn.danger{background:var(--warn-soft);color:var(--warn)}
.btn.big{padding:14px;font-size:17px;width:100%}
.btn.sq{padding:0;width:44px;height:44px;flex:none;display:grid;place-items:center}
.btns{display:flex;gap:8px;flex-wrap:wrap}

/* pills & chips */
.pills{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 14px}
.pill{font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:4px 10px}
.now{background:linear-gradient(135deg,var(--soft),var(--card) 70%)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;font-size:14px;font-weight:600}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wrapchips{flex-wrap:wrap;overflow:visible}

/* install & banners */
.install .x{position:absolute;top:6px;right:6px}
.install p,.banner p{margin:6px 0 10px;font-size:14px;color:var(--mute)}
.install svg{vertical-align:-3px}
.banner{border-color:var(--warn-soft)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;
  background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav.tabs > div{display:flex;width:100%;max-width:560px}
nav button{flex:1;border:0;background:none;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600}
nav button.on{color:var(--accent)}

/* onboarding */
.ob{max-width:520px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
.ob .logo{width:72px;height:72px;border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.ob .logo img{width:100%;display:block}
.ob h1{font-size:30px;margin:16px 0 0;letter-spacing:-.02em}
.steps{font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.07em}
.obnav{display:flex;gap:10px;margin-top:18px}
.obnav .btn{flex:1;padding:14px}
.center{text-align:center}

/* toast */
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-150%);z-index:20;
  width:min(92vw,440px);background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 16px;font-size:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .3s}
#toast.show{transform:translate(-50%,0)}
#toast div{opacity:.85;margin-top:4px}
</style>
</head>
<body>
<div id="ob" hidden></div>
<div id="app" hidden>
  <main class="wrap" id="view"></main>
  <nav class="tabs" aria-label="Sections"><div>
    <button data-a="tab" data-id="today"><span data-icon="sun"></span>Today</button>
    <button data-a="tab" data-id="plan"><span data-icon="list"></span>Plan</button>
    <button data-a="tab" data-id="sched"><span data-icon="cal"></span>Schedule</button>
    <button data-a="tab" data-id="me"><span data-icon="user"></span>Me</button>
  </div></nav>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="restoreFile" accept=".json,application/json" data-c="restore" hidden>

<script>
'use strict';
/* ---------- helpers ---------- */
const KEY = 'dayboost:v1';
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T00:00'); d.setDate(d.getDate() + n); return ymd(d); };
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00') - new Date(a + 'T00:00')) / 864e5);
const toMin = (s) => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
const fromMin = (m) => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const fmtTime = (s) => { if (!s) return ''; let [h, m] = s.split(':').map(Number); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${pad(m)} ${ap}`; };
const fmtDay = (s) => {
  const t = today();
  if (s === t) return 'Today';
  if (s === addDays(t, 1)) return 'Tomorrow';
  if (s === addDays(t, -1)) return 'Yesterday';
  return new Date(s + 'T00:00').toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
};
const weekday = (s, style = 'long') => new Date(s + 'T00:00').toLocaleDateString(undefined, { weekday: style });
const BEFORE = { 0: 'At the time', 10: '10 min before', 30: '30 min before', 60: '1 hour before', 120: '2 hours before', 1440: '1 day before' };
const REPEAT = { 0: 'One-time', 1: 'Daily', 3: 'Every 3 days', 7: 'Weekly', 14: 'Every 2 weeks', 30: 'Monthly' };

const svg = (p, w = 22) => `<svg viewBox="0 0 24 24" width="${w}" height="${w}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I = {
  check: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  bell: svg('<path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>', 20),
  bellOff: svg('<path d="M8.7 3A6 6 0 0 1 18 8c0 2.7.4 4.6 1 6"/><path d="M17 17H3s3-2 3-9c0-.8.1-1.5.4-2.2"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><path d="M3 3l18 18"/>', 20),
  trash: svg('<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/>', 18),
  plus: svg('<path d="M12 5v14M5 12h14"/>', 20),
  share: svg('<path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/>', 16),
  sun: svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
  list: svg('<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/>'),
  cal: svg('<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>'),
  user: svg('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'),
};

/* ---------- data ---------- */
const DEFAULT_HABITS = [
  { id: 'water', icon: '💧', name: 'Drink water', desc: 'Tap the circle for each glass', time: '09:00', reminder: true, goal: 8, repeatHours: 2, endTime: '21:00' },
  { id: 'workout', icon: '🏋️', name: 'Workout with weight training', time: '07:00', reminder: true },
  { id: 'cardio', icon: '🏃', name: 'Cardio or sports', time: '18:00', reminder: true },
  { id: 'selfcare', icon: '🧴', name: 'Self-care routine', time: '21:30', reminder: true },
  { id: 'protein', icon: '🥚', name: 'Protein-rich meal', time: '13:00', reminder: true },
  { id: 'fruit', icon: '🍎', name: 'At least 1 fruit', time: '16:00', reminder: false },
  { id: 'quiet', icon: '🧘', name: 'Personal quiet time', time: '06:30', reminder: false },
  { id: 'connect', icon: '💬', name: 'Connect with someone who matters', desc: 'At least 5 minutes', time: '20:00', reminder: true },
  { id: 'plan', icon: '📝', name: "Plan tomorrow's to-dos", desc: 'Done automatically once tomorrow has a to-do', time: '22:00', reminder: true },
];
const LOW_SUGGESTIONS = [['🧹 House cleaning', 7], ['🧺 Laundry', 7], ['🛒 Groceries', 7], ['💳 Pay bills', 30], ['🪴 Water plants', 3], ['📦 Declutter a drawer', 0]];

const defaults = () => ({
  v: 1, profile: null, habits: DEFAULT_HABITS.map((h) => ({ ...h })),
  settings: { checkinHours: 3, dayStart: '08:00', dayEnd: '22:00' },
  todos: {}, appts: [], low: [], log: {}, fired: {}, lastDay: null, hideInstall: false,
});
function load() {
  try { const r = JSON.parse(localStorage.getItem(KEY)); if (r && r.habits) return Object.assign(defaults(), r); } catch (e) {}
  return defaults();
}
let S = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Could not save', 'Storage may be full or blocked.'); } }

const hab = (id) => S.habits.find((h) => h.id === id);
const todosOn = (d) => (S.todos[d] || []).filter((x) => !x.movedTo);
const findTodo = (d, id) => (S.todos[d] || []).find((x) => x.id === id);
const dayLog = (d) => S.log[d] || (S.log[d] = {});
const getCount = (h, d) => Number((S.log[d] || {})[h.id]) || 0;
function isDone(h, d) {
  const v = (S.log[d] || {})[h.id];
  if (h.goal) return (Number(v) || 0) >= h.goal;
  if (h.id === 'plan') return !!v || (S.todos[addDays(d, 1)] || []).some((x) => !x.movedTo && !x.carried);
  return !!v;
}
const occursOn = (a, d) => a.repeat === 'weekly' ? d >= a.date && weekday(d) === weekday(a.date) : a.date === d;
function nextOcc(a, from) {
  if (a.repeat !== 'weekly') return a.date;
  const start = a.date > from ? a.date : from;
  for (let i = 0; i < 7; i++) { const x = addDays(start, i); if (occursOn(a, x)) return x; }
}
const apptsOn = (d) => S.appts.filter((a) => occursOn(a, d)).sort((x, y) => x.time.localeCompare(y.time));
const apptDone = (a, d) => !!(a.doneDates || {})[d];
const lowDone = (x, d) => !!x.done && (!x.repeat || daysBetween(x.done, d) < x.repeat);

function remaining(d = today()) {
  const r = [];
  S.habits.forEach((h) => { if (!isDone(h, d)) r.push(`${h.icon} ${h.name}${h.goal ? ` (${getCount(h, d)}/${h.goal})` : ''}`); });
  todosOn(d).forEach((x) => { if (!x.done) r.push(`☐ ${x.title}`); });
  apptsOn(d).forEach((a) => { if (!apptDone(a, d)) r.push(`📅 ${fmtTime(a.time)} ${a.title}`); });
  S.low.forEach((x) => { if (!lowDone(x, d)) r.push(`◦ ${x.title}`); });
  return r;
}
function progress(d = today()) {
  let done = 0, total = 0;
  S.habits.forEach((h) => { total++; if (isDone(h, d)) done++; });
  todosOn(d).forEach((x) => { total++; if (x.done) done++; });
  apptsOn(d).forEach((a) => { total++; if (apptDone(a, d)) done++; });
  return { done, total };
}
const dayComplete = (d) => S.habits.length && S.habits.every((h) => isDone(h, d));
function streak() {
  let n = 0, d = today();
  if (dayComplete(d)) n++;
  d = addDays(d, -1);
  while (n < 3650 && dayComplete(d)) { n++; d = addDays(d, -1); }
  return n;
}

/* Unfinished to-dos from earlier days move into today, keeping their time + reminder. */
function rollover() {
  const t = today();
  if (S.lastDay === t) return false;
  Object.keys(S.todos).filter((d) => d < t).sort().forEach((d) => {
    S.todos[d].forEach((x) => {
      if (x.done || x.movedTo) return;
      (S.todos[t] = S.todos[t] || []).push({ ...x, id: uid(), done: false, carried: (x.carried || 0) + 1, from: x.from || d });
      x.movedTo = t;
    });
  });
  const cutoff = addDays(t, -2);
  for (const k in S.fired) if (k.slice(0, 10) < cutoff) delete S.fired[k];
  S.lastDay = t;
  save();
  return true;
}

/* ---------- notifications & reminders ---------- */
let deferredPrompt = null;
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (!/android/i.test(navigator.userAgent) && navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isMobile = isIOS || /android|mobile/i.test(navigator.userAgent);
function notifState() {
  if (!('Notification' in window)) return isIOS && !standalone ? 'ios-install' : 'unsupported';
  return Notification.permission;
}
async function askNotif() {
  const st = notifState();
  if (st === 'ios-install') { toast('Install first for reminders', 'On iPhone, add DayBoost to your Home Screen, then open it from there.'); return; }
  if (st === 'unsupported') { toast('This browser can’t show notifications', 'Reminders will still appear inside the app.'); return; }
  if (st === 'denied') { toast('Notifications are blocked', 'Allow them for this site in your phone/browser settings.'); return; }
  if (st === 'default') {
    const p = await Notification.requestPermission();
    if (p === 'granted') notify('Reminders are on ✅', 'You’ll get nudges at the times you set.', 'welcome');
    render();
  }
}
async function notify(title, body, tag) {
  toast(title, body);
  if (navigator.vibrate) navigator.vibrate([150, 80, 150]);
  if (notifState() !== 'granted') return;
  const opts = { body, tag, icon: 'icons/icon-192.png', badge: 'icons/icon-192.png', renotify: true };
  try {
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if (reg) return reg.showNotification(title, opts);
  } catch (e) {}
  try { new Notification(title, opts); } catch (e) {}
}
const WINDOW = 20; // a missed reminder still fires if the app is opened within 20 min
function checkinSlots() {
  const { checkinHours: n, dayStart, dayEnd } = S.settings, out = [];
  if (!n) return out;
  for (let t = toMin(dayStart) + n * 60; t <= toMin(dayEnd); t += n * 60) out.push(t);
  return out;
}
function tick() {
  if (!S.profile) return;
  if (rollover()) render();
  const d = today(), m = nowMin();
  const due = (key, t) => m >= t && m < t + WINDOW && !S.fired[key];
  const fire = (key, title, body) => { S.fired[key] = 1; notify(title, body, key); };

  S.habits.forEach((h) => {
    if (!h.reminder || !h.time || isDone(h, d)) return;
    const times = [toMin(h.time)];
    if (h.repeatHours) for (let t = times[0] + h.repeatHours * 60; t <= toMin(h.endTime || '21:00'); t += h.repeatHours * 60) times.push(t);
    times.forEach((t) => {
      const k = `${d}|h|${h.id}|${t}`;
      if (due(k, t)) fire(k, `${h.icon} ${h.name}`, h.goal ? `${getCount(h, d)} of ${h.goal} glasses so far.` : (h.desc || 'It’s time. Tap ✓ once it’s done.'));
    });
  });
  todosOn(d).forEach((x) => {
    if (!x.reminder || !x.time || x.done) return;
    const k = `${d}|t|${x.id}`;
    if (due(k, toMin(x.time))) fire(k, `📝 ${x.title}`, x.carried ? `Carried over from ${fmtDay(x.from)}. Let’s finish it today.` : 'To-do reminder');
  });
  S.appts.forEach((a) => {
    if (!a.reminder) return;
    [d, addDays(d, 1)].forEach((od) => {
      if (!occursOn(a, od) || apptDone(a, od)) return;
      const rt = new Date(new Date(`${od}T${a.time}`) - (a.before || 0) * 60000);
      if (ymd(rt) !== d) return;
      const k = `${d}|a|${a.id}|${od}`;
      if (due(k, rt.getHours() * 60 + rt.getMinutes())) fire(k, `📅 ${a.title}`, `${fmtDay(od)} at ${fmtTime(a.time)}${a.before ? ` (${BEFORE[a.before] || a.before + ' min before'})` : ''}`);
    });
  });
  S.low.forEach((x) => {
    if (!x.reminder || !x.time || lowDone(x, d)) return;
    const k = `${d}|l|${x.id}`;
    if (due(k, toMin(x.time))) fire(k, x.title, 'Low priority, but it still needs doing.');
  });
  checkinSlots().forEach((t) => {
    const k = `${d}|s|${t}`;
    if (!due(k, t)) return;
    const r = remaining(d);
    if (!r.length) { S.fired[k] = 1; return; }
    fire(k, `Check-in: ${r.length} left today`, r.slice(0, 6).join('\n') + (r.length > 6 ? `\n+${r.length - 6} more` : ''));
  });
  save();
}

let toastTimer;
function toast(title, body = '') {

  el.classList.add('show');

  toastTimer = setTimeout(() => el.classList.remove('show'), body ? 7000 : 2600);
}
const bellBtn = (a, id, on, d = '') =>
  `<button class="icon-btn bell ${on ? 'on' : ''}" data-a="${a}" data-id="${id}" ${d ? `data-d="${d}"` : ''} aria-pressed="${!!on}" aria-label="${on ? 'Reminder on' : 'Reminder off'}">${on ? I.bell : I.bellOff}</button>`;
const delBtn = (a, id, d = '') => `<button class="icon-btn" data-a="${a}" data-id="${id}" ${d ? `data-d="${d}"` : ''} aria-label="Delete">${I.trash}</button>`;

function ring({ done, total }) {
  const pct = total ? done / total : 0, C = 2 * Math.PI * 25;
  return `<div class="ring" aria-label="${done} of ${total} done"><svg viewBox="0 0 62 62" width="62" height="62"><circle cx="31" cy="31" r="25" class="trk"/><circle cx="31" cy="31" r="25" class="bar" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}" transform="rotate(-90 31 31)"/></svg><span>${Math.round(pct * 100)}%</span></div>`;
}
function habitRow(h, d) {

  const check = h.goal
    ? `<button class="check water" data-a="water" data-id="${h.id}" aria-label="Add a glass">${done ? I.check : n}</button>`
    : `<button class="check" data-a="habit" data-id="${h.id}" aria-label="Mark done">${I.check}</button>`;
  return `<div class="row ${done ? 'done' : ''}">${check}<div class="body">

    <div class="sub">${timeIn('htime', h.id, h.time)}

/* ---------- export ---------- */
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
}
function exportICS() {
  const icsText = (s) => String(s).replace(/[\\;,]/g, (m) => '\\' + m).replace(/\n/g, '\\n');
  const dt = (date, time) => date.replace(/-/g, '') + 'T' + time.replace(':', '') + '00';
  const stamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//DayBoost//EN', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:DayBoost'];
  let n = 0;
  const ev = (id, title, start, rrule, before) => {
    n++;
    L.push('BEGIN:VEVENT', `UID:${id}@dayboost`, `DTSTAMP:${stamp}`, `DTSTART:${start}`, 'DURATION:PT15M', `SUMMARY:${icsText(title)}`);
    if (rrule) L.push(`RRULE:${rrule}`);
    L.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsText(title)}`, `TRIGGER:-PT${before || 0}M`, 'END:VALARM', 'END:VEVENT');
  };
  const t = today();
  S.habits.forEach((h) => {
    if (!h.reminder || !h.time) return;
    ev(`h-${h.id}`, `${h.icon} ${h.name}`, dt(t, h.time), 'FREQ=DAILY');
    if (h.repeatHours) for (let m = toMin(h.time) + h.repeatHours * 60, i = 1; m <= toMin(h.endTime || '21:00'); m += h.repeatHours * 60, i++)
      ev(`h-${h.id}-${i}`, `${h.icon} ${h.name}`, dt(t, fromMin(m)), 'FREQ=DAILY');
  });
  S.appts.forEach((a) => {
    if (a.repeat !== 'weekly' && a.date < t) return;
    ev(`a-${a.id}`, a.title, dt(a.date, a.time), a.repeat === 'weekly' ? 'FREQ=WEEKLY' : null, a.reminder ? a.before : 0);
  });
  if (!n) return toast('Nothing to export', 'Turn on a reminder or add an appointment first.');
  L.push('END:VCALENDAR');
  download('dayboost-reminders.ics', L.join('\r\n'), 'text/calendar');
  toast('Calendar file ready', 'Open it and choose “Add all” to put your reminders in your phone’s calendar.');
}

/* ---------- actions ---------- */
const needTime = (btn) => {
  toast('Pick a time first', 'Then tap the bell to turn the reminder on.');
  const inp = btn.closest('.row')?.querySelector('input[type=time]');
  if (inp) { inp.focus(); try { inp.showPicker(); } catch (e) {} }
};
const A = {
  tab(id) { tab = id; render(); scrollTo(0, 0); },
  habit(id) { const L = dayLog(today()); L[id] = !isDone(hab(id), today()); save(); render(); },
  water(id) { const h = hab(id), L = dayLog(today()), n = getCount(h, today()); L[id] = n >= h.goal ? h.goal - 1 : n + 1; save(); render(); if (L[id] === h.goal) toast('💧 Water goal reached!'); },
  waterMinus(id) { const L = dayLog(today()); L[id] = Math.max(0, getCount(hab(id), today()) - 1); save(); render(); },
  hbell(id, d, b) { const h = hab(id); if (!h.time && !h.reminder) return needTime(b); h.reminder = !h.reminder; save(); render(); if (h.reminder) askNotif(); },
  hdel(id) { if (confirm('Remove this habit?')) { S.habits = S.habits.filter((h) => h.id !== id); save(); render(); } },
  todo(id, d) { const x = findTodo(d, id); x.done = !x.done; save(); render(); },
  tbell(id, d, b) { const x = findTodo(d, id); if (!x.time && !x.reminder) return needTime(b); x.reminder = !x.reminder; save(); render(); if (x.reminder) askNotif(); },
  tdel(id, d) { S.todos[d] = S.todos[d].filter((x) => x.id !== id); save(); render(); },
  moveAll() {
    const t = today(), tm = addDays(t, 1);
    todosOn(t).filter((x) => !x.done).forEach((x) => {
      (S.todos[tm] = S.todos[tm] || []).push({ ...x, id: uid(), carried: (x.carried || 0) + 1, from: x.from || t });
      x.movedTo = tm;
    });
    save(); planDay = tm; render(); toast('Moved to tomorrow');
  },
  planDay(id) { planDay = id; render(); },
  appt(id, d) { const a = S.appts.find((a) => a.id === id); a.doneDates = a.doneDates || {}; a.doneDates[d] = !a.doneDates[d]; save(); render(); },
  abell(id) { const a = S.appts.find((a) => a.id === id); a.reminder = !a.reminder; save(); render(); if (a.reminder) askNotif(); },
  adel(id) { const a = S.appts.find((a) => a.id === id); if (confirm(`Delete “${a.title}”${a.repeat === 'weekly' ? ' (all weeks)' : ''}?`)) { S.appts = S.appts.filter((x) => x.id !== id); save(); render(); } },
  low(id) { const x = S.low.find((x) => x.id === id); x.done = lowDone(x, today()) ? null : today(); save(); render(); },
  lbell(id, d, b) { const x = S.low.find((x) => x.id === id); if (!x.time && !x.reminder) return needTime(b); x.reminder = !x.reminder; save(); render(); if (x.reminder) askNotif(); },
  ldel(id) { S.low = S.low.filter((x) => x.id !== id); save(); render(); },
  notif() { askNotif(); },
  test() { notify('🔔 Test reminder', 'If you can see this, reminders work.', 'test'); },
  ics: exportICS,
  install() { if (!deferredPrompt) return; deferredPrompt.prompt(); deferredPrompt.userChoice.finally(() => { deferredPrompt = null; render(); }); },
  hideInstall() { S.hideInstall = true; save(); render(); },
  backup() { download(`dayboost-backup-${today()}.json`, JSON.stringify(S, null, 1), 'application/json'); },
  restorePick() { $('#restoreFile').click(); },
  reset() { if (confirm('Erase all DayBoost data on this phone? This can’t be undone.')) { localStorage.removeItem(KEY); location.reload(); } },
  obStep(id) { ob.step = Number(id); render(); scrollTo(0, 0); },
  obPick(i) { const t = LOW_SUGGESTIONS[i][0]; ob.pick.has(t) ? ob.pick.delete(t) : ob.pick.add(t); render(); },
  obDone() {
    S.profile = { name: ob.name, age: ob.age };
    LOW_SUGGESTIONS.forEach(([t, rep]) => { if (ob.pick.has(t)) S.low.push({ id: uid(), title: t, repeat: rep, time: '', reminder: false, done: null }); });
    S.lastDay = today();
    save(); tab = 'today'; render(); scrollTo(0, 0);
    navigator.storage?.persist?.();
  },
};
const C = {
  htime(id, v) { const h = hab(id); h.time = v; if (!v) h.reminder = false; save(); render(); },
  hend(id, v) { hab(id).endTime = v || '21:00'; save(); },
  hrep(id, v) { hab(id).repeatHours = Number(v); save(); render(); },
  hgoal(id, v) { hab(id).goal = Number(v); save(); },
  hicon(id, v) { hab(id).icon = v.trim() || '⭐'; save(); },
  hname(id, v) { if (v.trim()) { hab(id).name = v.trim(); save(); } },
  ttime(id, v, el) { const x = findTodo(el.dataset.d, id); x.time = v; x.reminder = !!v; save(); render(); },
  ltime(id, v) { const x = S.low.find((x) => x.id === id); x.time = v; x.reminder = !!v; save(); render(); },
  planDate(id, v) { if (v) { planDay = v; render(); } },
  pname(id, v) { if (v.trim()) { S.profile.name = v.trim(); save(); } },
  page(id, v) { S.profile.age = v; save(); },
  checkin(id, v) { S.settings.checkinHours = Number(v); save(); },
  dayStart(id, v) { if (v) { S.settings.dayStart = v; save(); } },
  dayEnd(id, v) { if (v) { S.settings.dayEnd = v; save(); } },
  restore(id, v, el) {
    const f = el.files[0]; if (!f) return;
    f.text().then((txt) => {
      const obj = JSON.parse(txt);
      if (!obj || !Array.isArray(obj.habits)) throw new Error('bad file');
      S = Object.assign(defaults(), obj); save(); tab = 'today'; render(); toast('Backup restored ✅');
    }).catch(() => toast('That file isn’t a DayBoost backup')).finally(() => { el.value = ''; });
  },
};
const F = {
  addTodo(f) {
    const text = f.elements.text.value.trim(); if (!text) return;
    const d = f.dataset.d, time = f.elements.time.value;
    (S.todos[d] = S.todos[d] || []).push({ id: uid(), title: text, time, reminder: !!time, done: false });
    save(); render();
    $(`form[data-f=addTodo][data-d="${d}"] input[name=text]`)?.focus();
    if (time) askNotif();
  },
  addLow(f) {
    const text = f.elements.text.value.trim(); if (!text) return;
    S.low.push({ id: uid(), title: text, repeat: Number(f.elements.repeat.value), time: '', reminder: false, done: null });
    save(); render();
  },
  addAppt(f) {
    const e = f.elements, before = Number(e.before.value);
    S.appts.push({ id: uid(), title: e.text.value.trim(), date: e.date.value, time: e.time.value, before: Math.max(0, before), reminder: before >= 0, repeat: e.repeat.value, doneDates: {} });
    save(); render(); toast('Added to schedule', `${e.text.value.trim()}, ${fmtDay(e.date.value)} at ${fmtTime(e.time.value)}`);
    if (before >= 0) askNotif();
  },
  addHabit(f) {
    const text = f.elements.text.value.trim(); if (!text) return;
    const time = f.elements.time.value;
    S.habits.push({ id: uid(), icon: f.elements.icon.value.trim() || '⭐', name: text, time, reminder: !!time, custom: true });
    save(); render();
  },
  ob0(f) { ob.name = f.elements.name.value.trim(); ob.age = f.elements.age.value; if (ob.name) A.obStep(1); },
};
document.addEventListener('click', (e) => {
  const b = e.target.closest('button[data-a]');
  if (b && A[b.dataset.a]) { e.preventDefault(); A[b.dataset.a](b.dataset.id, b.dataset.d, b); }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.c && C[t.dataset.c]) C[t.dataset.c](t.dataset.id, t.value, t);
});
document.addEventListener('submit', (e) => {
  const f = e.target;
  if (f.dataset.f && F[f.dataset.f]) { e.preventDefault(); F[f.dataset.f](f); }
});
$('#toast').addEventListener('click', () => $('#toast').classList.remove('show'));

/* ---------- boot ---------- */
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; render(); });
window.addEventListener('appinstalled', () => { deferredPrompt = null; toast('DayBoost installed 🎉', 'Open it from your home screen.'); render(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); render(); } });
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
rollover();
render();
tick();
setInterval(tick, 30000);
</script>
</body>
</html>
